name: Weekly SEO & Agritech Compliance Audit

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  seo-compliance-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run SEO, Schema & Accessibility Audit
        run: npm run audit

      - name: Run Unit & Integration Test Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

